<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Unga Bunga V2</title>

<script type="module">

import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

import {
getDatabase, ref, set, get, push, onValue, update
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-database.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
onAuthStateChanged,
signOut
} from "https://www.gstatic.com/firebasejs/12.13.0/firebase-auth.js";

/* 🔥 FIREBASE */
const firebaseConfig = {
apiKey:"AIzaSyB-kVC8nGY1JEFEV79Yexpg8-etJDXIp68",
authDomain:"muj-flopik.firebaseapp.com",
databaseURL:"https://muj-flopik-default-rtdb.europe-west1.firebasedatabase.app",
projectId:"muj-flopik",
storageBucket:"muj-flopik.firebasestorage.app",
messagingSenderId:"198721412738",
appId:"1:198721412738:web:a3644bda03f4bc682d5e9b"
};

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);
const auth = getAuth(app);

let currentUser=null;
let currentUID=null;

/* ========== AUTH ========== */

window.register = async function(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;
let username=document.getElementById("username").value;

let userCred = await createUserWithEmailAndPassword(auth,email,pass);

await set(ref(db,"users/"+userCred.user.uid),{
email,
username,
money:1000,
role:"user"
});

alert("Registrován");
};

window.login = async function(){
let email=document.getElementById("email").value;
let pass=document.getElementById("pass").value;

await signInWithEmailAndPassword(auth,email,pass);
};

window.logout = async function(){
await signOut(auth);
};

/* ========== USER STATE ========== */

onAuthStateChanged(auth,async(user)=>{

if(!user){
document.getElementById("app").style.display="none";
document.getElementById("login").style.display="block";
return;
}

currentUID=user.uid;

let snap=await get(ref(db,"users/"+user.uid));
currentUser=snap.val();

document.getElementById("login").style.display="none";
document.getElementById("app").style.display="block";

loadDashboard();

});

function loadDashboard(){
document.getElementById("info").innerHTML=
"Uživatel: "+currentUser.username+"<br>"+
"Hungy: "+currentUser.money;
}

</script>

<style>
body{
margin:0;
font-family:Arial;
background:#0f172a;
color:white;
}

.container{
padding:20px;
max-width:600px;
margin:auto;
}

.card{
background:#1e293b;
padding:20px;
border-radius:15px;
margin-top:20px;
}

input,button{
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:none;
}

button{
background:#2563eb;
color:white;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<!-- LOGIN -->
<div id="login" class="card">

<h2>Přihlášení</h2>

<input id="email" placeholder="Email">
<input id="pass" type="password" placeholder="Heslo">
<input id="username" placeholder="Jméno (jen registrace)">

<button onclick="login()">Login</button>
<button onclick="register()">Register</button>

</div>

<!-- APP -->
<div id="app" class="card" style="display:none">

<h2>Dashboard</h2>

<div id="info"></div>

<button onclick="logout()">Logout</button>

</div>

</div>

</body>
</html>
